name: ci
on: [push, pull_request]
jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v1
      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./build.ps1 -Task Test -Bootstrap
